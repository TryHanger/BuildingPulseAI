            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuntimeSignalQuality"
            }
          },
          "symptom_evaluation": {
            "$ref": "#/components/schemas/RuntimeG3Evaluation"
          }
        },
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": {
                "anomaly_status": {
                  "const": "DETECTED"
                }
              }
            },
            "then": {
              "properties": {
                "issue_class": {
                  "const": "SIGNAL_RANGE_VIOLATION"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "anomaly_status": {
                  "not": {
                    "const": "DETECTED"
                  }
                }
              }
            },
            "then": {
              "properties": {
                "issue_class": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "mode": {
                  "enum": [
                    "OFF"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "fan_on": {
                  "const": false
                },
                "weather_context": {
                  "const": "UNASSESSED"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "mode": {
                  "enum": [
                    "UNKNOWN"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "fan_on": {
                  "const": null
                },
                "weather_context": {
                  "const": "UNASSESSED"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "mode": {
                  "enum": [
                    "RUNNING",
                    "TRANSITION_HOLD"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "fan_on": {
                  "const": true
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "mode": {
                  "not": {
                    "const": "RUNNING"
                  }
                }
              }
            },
            "then": {
              "properties": {
                "weather_context": {
                  "const": "UNASSESSED"
                }
              }
            }
          }
        ]
