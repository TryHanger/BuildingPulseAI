            ]
          },
          "methods": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuntimeMethod"
            }
          },
          "issue_class": {
            "anyOf": [
              {
                "const": "SIGNAL_RANGE_VIOLATION"
              },
              {
                "type": "null"
              }
            ]
          },
          "weather_context": {
            "$ref": "#/components/schemas/RuntimeWeatherContext"
          },
